modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''
logoFile = "simplebarrels_logo.png"
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "workshopcore"
mandatory = true
versionRange = "[1.0.0-alpha.9,2.0)"
ordering = "AFTER"
side = "BOTH"
[modproperties.${mod_id}]
"workshopcore:features" = ["dolly"]
